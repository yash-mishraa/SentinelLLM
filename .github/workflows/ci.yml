name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

# Concurrency control: automatically cancel obsolete runs on same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run Ruff linter
        run: |
          python -m ruff check src promptprobe tests scripts

      - name: Run Ruff format check
        run: |
          python -m ruff format --check src promptprobe tests scripts

      - name: Run Mypy strict type checker
        run: |
          python -m mypy src promptprobe tests scripts

      - name: Run Pytest test suite with code coverage (>= 80%)
        run: |
          python -m pytest --cov=sentinelllm --cov=promptprobe --cov-report=xml --cov-report=term-missing tests/unit tests/security

      - name: Validate distribution wheel and sdist package build
        run: |
          python -m build

  frontend-quality:
    name: Frontend Quality Gate (Next.js 15 / Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript type checker
        working-directory: web
        run: npm run typecheck

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Run automated frontend security and logic tests
        working-directory: web
        run: npm test

      - name: Build production Next.js application
        working-directory: web
        run: npm run build

      - name: Verify zero raw secrets in generated client bundles
        working-directory: web
        run: node src/__tests__/bundle_security.test.mjs

  postgres-integration:
    name: PostgreSQL Integration & Migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelllm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with PostgreSQL drivers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Execute Alembic schema migrations on PostgreSQL
        env:
          SENTINELLLM_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/sentinelllm_test
        run: |
          python scripts/migrate.py upgrade head

      - name: Run PostgreSQL Integration Test Suite (Row Locks, Rollback, Concurrency)
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres_ci_password@localhost:5432/sentinelllm_test
          CI_ENFORCE_POSTGRES: "true"
        run: |
          python -m pytest -v tests/integration/test_postgres_integration.py

  demo-and-benchmarks:
    name: Deterministic Demo & PromptProbe Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run 6-Stage Deterministic Security Walkthrough
        run: |
          python -m sentinelllm.demo

      - name: Run PromptProbe Benchmark (Adversarial Cases & Multi-Step Scenarios)
        run: |
          python -m promptprobe run --include-scenarios

  docker-validation:
    name: Production Docker Build & Healthcheck Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production multi-stage container image
        run: |
          docker build -t sentinelllm:ci-test .

      - name: Run test container
        run: |
          docker run -d \
            --name sentinelllm-test \
            -p 8000:8000 \
            -e SENTINELLLM_ENV=development \
            sentinelllm:ci-test

      - name: Poll container liveness probe (/healthz)
        run: |
          for i in {1..15}; do
            if curl -f -s http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "Container liveness probe verified successfully."
              exit 0
            fi
            echo "Waiting for container startup... ($i/15)"
            sleep 2
          done
          echo "Container liveness probe timed out."
          docker logs sentinelllm-test
          exit 1

      - name: Verify non-root runtime execution
        run: |
          CONTAINER_UID=$(docker exec sentinelllm-test id -u)
          echo "Container running as UID: $CONTAINER_UID"
          if [ "$CONTAINER_UID" -eq 0 ]; then
            echo "SECURITY VIOLATION: Container is running as root (UID 0)!"
            exit 1
          fi

      - name: Stop and clean up container
        if: always()
        run: |
          docker stop sentinelllm-test || true
          docker rm sentinelllm-test || true
