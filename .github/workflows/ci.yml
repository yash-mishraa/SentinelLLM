name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          python -m ruff check src promptprobe tests

      - name: Run Ruff format check
        run: |
          python -m ruff format --check src promptprobe tests

      - name: Run Mypy type checker
        run: |
          python -m mypy src promptprobe tests

      - name: Run Pytest test suite with coverage
        run: |
          python -m pytest --cov=sentinelllm --cov=promptprobe --cov-report=xml --cov-report=term-missing tests

      - name: Validate package build
        run: |
          python -m build
